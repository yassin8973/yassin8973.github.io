name: Pages Workflow
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Apply
        env:
          A9CC64: ${{ secrets.A9CC64 }}
          BFA062: ${{ secrets.BFA062 }}
        run: |
          python3 -c "
          import os, sys, pathlib
          tag_a = os.environ.get('A9CC64', '')
          tag_b = os.environ.get('BFA062', '')
          fpath = pathlib.Path('index.html')
          orig = fpath.read_text(encoding='utf-8')
          updated = orig
          if tag_a:
              updated = updated.replace('<!-- 44d7bee577552c75cda6d85df076dfdf4663c65a49 -->', tag_a)
          if tag_b:
              updated = updated.replace('<!-- 76b6b23a576fbdbded59bb -->', tag_b)
          if updated == orig and (tag_a or tag_b):
              sys.exit(1)
          if updated != orig:
              fpath.write_text(updated, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: release
        uses: actions/deploy-pages@v4
